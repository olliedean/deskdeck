[package]
name = "deskdeck-core"
version = "0.1.0"
edition = "2021"

[dependencies]
deskdeck-protocol = { version = "0.1.0", path = "../protocol" }
async-trait = "0.1.75"
enigo = "0.6"
once_cell = "1.21.4"
open = "5.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
thiserror = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "process", "time"] }
toml = "0.8"
uuid = { version = "1.28", features = ["serde", "v4", "v5"] }