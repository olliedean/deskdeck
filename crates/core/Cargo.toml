[package]
name = "deskdeck-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
enigo = { version = "0.6", default-features = false, features = ["wayland", "x11rb"] }
async-trait = "0.1"
deskdeck-protocol = { path = "../protocol" }
open = "3"
tokio = { version = "1", features = ["full"] }