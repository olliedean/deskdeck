[package]
name = "deskdeck-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
qrcode = "0.14"
uuid = { version = "1", features = ["v4"] }
deskdeck-protocol = { path = "../protocol" }
deskdeck-core = { path = "../core" }
futures-util = "0.3"