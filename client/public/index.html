<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#18191b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DeskDeck">
    <title>DeskDeck</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
</head>
<body>
    <main class="app-shell">
        <section class="workspace" aria-label="Deck controls">
            <nav id="page-tabs" class="page-tabs" aria-label="Deck pages" hidden></nav>
            <div class="deck-frame">
                <div class="deck-grid" id="buttons" aria-label="Buttons" aria-live="polite"></div>
            </div>
        </section>
        <div class="toast" id="toast" role="alert" hidden></div>
    </main>
</body>
</html>
