[deck]
name = "Main"
grid = { cols = 5, rows = 3 }

[[page]]
name = "Home"

# Icons use Font Awesome Free classes.
[[page.button]]
id = "home"
label = "Desktop"
icon = "fa-solid fa-desktop"
on_press = [
    { action = "hotkey", keys = ["win", "d"] }
]

[[page.button]]
id = "mute"
label = "Mute mic"
icon = "fa-solid fa-microphone-slash"
on_press = [
    { action = "hotkey", keys = ["ctrl", "shift", "m"] }
]

[[page.button]]
id = "web"
label = "Browser"
icon = "fa-solid fa-globe"
on_press = [
    { action = "url", url = "https://example.com" }
]